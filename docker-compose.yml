services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: educaro, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro", "postgres_data:/var/lib/postgresql/data"]
volumes: { postgres_data: {} }
